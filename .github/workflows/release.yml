name: Release

on:
  push:
    branches: [main]

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Release
        uses: ltv/standard-version-action@v2
        with:
          minorWording: 'feat'
          majorWording: 'BREAKING CHANGE'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
